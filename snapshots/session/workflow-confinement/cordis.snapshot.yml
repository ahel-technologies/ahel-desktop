# Replay the authored model turns through the shipped OS sandbox.
- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@ahel/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@ahel/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
