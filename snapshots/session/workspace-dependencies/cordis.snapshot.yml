# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@ahel/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@ahel/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@ahel/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: workspace-dependencies
      name: '@ahel/dsh-tool-workspace-dependencies'
      config:
        source: !!js process.cwd() + "/runtime-source"
        root: !!js process.cwd() + "/runtime-installed"

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
