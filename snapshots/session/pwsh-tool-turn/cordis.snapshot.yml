# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- insert:
    - id: llm-replay
      name: '@ahel/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@ahel/dsh-subprocess-local'

- id: bash-sandbox
  name: '@ahel/dsh-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@ahel/dsh-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@ahel/dsh-shell-env'

- id: agent-default-model
  name: '@ahel/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@ahel/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@ahel/dsh-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@ahel/dsh-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@ahel/dsh-goal'
  disabled: true

- id: goal-round-driver
  name: '@ahel/dsh-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@ahel/dsh-command-goal'
  disabled: true

- id: tool-goal
  name: '@ahel/dsh-tool-goal'
  disabled: true

- id: skill
  name: '@ahel/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@ahel/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@ahel/dsh-tool-skill'
  disabled: true

- id: tool-bash
  name: '@ahel/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@ahel/dsh-tool-pwsh'
  disabled: false
