# Build unsigned Ahel Desktop installers from a v* tag and publish them as a
# GitHub release of this repository, the feed packaged applications read
# through electron-updater.
# Code signing and notarization are not wired yet; see docs/phase3/RELEASE.md.
name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: package / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # One platform failing must not cancel the other; publish ships what built.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            script: package:desktop:mac:arm64:dev
            installer: dmg
          - os: windows-latest
            target: win-x64
            script: package:desktop:win:x64:unsigned
            installer: exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set the product version from the tag
        run: node apps/desktop/scripts/set-release-version.mjs "$GITHUB_REF_NAME"

      - name: Build
        run: pnpm run build

      # The Session lock loads this flock addon on macOS; packaging packs it as
      # @ahel/node-addon-system-darwin-<arch>. Windows locks through a kernel
      # semaphore and has no addon, so the script is a no-op there.
      - name: Build native addon
        run: pnpm run build:native-system

      # electron-builder's beforeBuild hook runs prepare-windows-installer.ps1 (MSVC on the hosted image).
      # The packaged smoke inside this step runs one replayed chat turn.
      - name: Package (unsigned)
        run: pnpm run ${{ matrix.script }}

      - name: Check the packaged native addon
        if: runner.os == 'macOS'
        run: |
          addon="apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/mac-arm64/Ahel Desktop.app/Contents/Resources/app.asar.unpacked/dsh/node_modules/@ahel/node-addon-system-darwin-arm64/bin/system.node"
          test -f "$addon" && file "$addon"

      - name: Collect release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          source="apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          mkdir -p release-assets
          cp "$source"/*.${{ matrix.installer }} "$source"/*.blockmap "$source"/latest*.yml release-assets/
          if [ "${{ matrix.target }}" = mac-arm64 ]; then cp "$source"/*.zip release-assets/; fi
          # A version-free copy keeps the landing's releases/latest/download/<asset> link stable.
          cp "$source/ahel-desktop-$version-${{ matrix.target }}-unsigned.${{ matrix.installer }}" \
            "release-assets/ahel-desktop-${{ matrix.target }}.${{ matrix.installer }}"
          ls -la release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    # Runs when a platform failed too: the release carries what built, and the
    # last step still fails the workflow so the broken platform stays visible.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          ls -la release-assets
          if [ ! -f release-assets/ahel-desktop-mac-arm64.dmg ]; then
            echo "::error::the mac-arm64 installer is missing; nothing is published"
            exit 1
          fi
          missing=()
          [ -f release-assets/ahel-desktop-win-x64.exe ] || missing+=("Windows x64")
          notes="Unsigned build of Ahel Desktop $version from ${GITHUB_SHA::12}. macOS: right-click the app and choose Open, or allow it in System Settings > Privacy & Security."
          if [ ${#missing[@]} -eq 0 ]; then
            notes="$notes Windows: SmartScreen > More info > Run anyway."
          else
            notes="$notes

          Not in this release: ${missing[*]} (the build failed; see $RUN_URL)."
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ahel Desktop $version" \
            --notes "$notes" \
            "${prerelease[@]}"

      - name: Fail when a platform did not build
        if: needs.package.result != 'success'
        run: |
          echo "::error::package result is ${{ needs.package.result }}; the release lacks a platform"
          exit 1
