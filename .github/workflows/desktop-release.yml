# Build Ahel Desktop installers from a v* tag and publish them as a GitHub
# release of this repository, the feed packaged applications read through
# electron-updater.
# macOS signing mode: full (signed, notarized, stapled) when all six Apple
# secrets are set (APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_TEAM_ID,
# ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64), dry (today's unsigned build)
# otherwise; Windows is unsigned. See docs/phase3/RELEASE.md.
#
# macOS builds on the org's self-hosted Mac minis (labels self-hosted, macOS,
# ARM64, macmini). This repository is public, so this workflow must only ever
# run trusted code: it triggers on tag pushes and manual dispatch, never on
# pull_request or pull_request_target. Do not add PR triggers here.
name: Desktop release

on:
  push:
    tags: ['v*']
  # Manual run: from a branch it builds both platforms and uploads them as
  # workflow artifacts only; from a v* tag with publish=true it also publishes.
  workflow_dispatch:
    inputs:
      mac_runner:
        description: macOS runner (macos-14 is the GitHub-hosted fallback, billed at 10x)
        type: choice
        options: [macmini, macos-14]
        default: macmini
      publish:
        description: Publish the GitHub release (only takes effect when run from a v* tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: package / ${{ matrix.target }}
    # Tag pushes have no inputs, so they take the self-hosted Mac minis.
    runs-on: ${{ matrix.os == 'mac' && (inputs.mac_runner == 'macos-14' && 'macos-14' || fromJSON('["self-hosted", "macOS", "ARM64", "macmini"]')) || matrix.os }}
    timeout-minutes: 120
    outputs:
      # Set by the mac-arm64 leg only; matrix legs combine their outputs.
      mac_signing: ${{ steps.signing.outputs.signing }}
    env:
      # The smallest mini (M1, 8 GB) also runs other agents; give V8 room without letting it take the box.
      NODE_OPTIONS: ${{ matrix.os == 'mac' && '--max-old-space-size=4096' || '' }}
    strategy:
      # One platform failing must not cancel the other; publish ships what built.
      fail-fast: false
      matrix:
        include:
          - os: mac
            target: mac-arm64
            script: package:desktop:mac:arm64:dev
            installer: dmg
          - os: windows-latest
            target: win-x64
            script: package:desktop:win:x64:unsigned
            installer: exe
    defaults:
      run:
        shell: bash
    steps:
      # checkout's default clean (git clean -ffdx, reset --hard) already empties a reused workspace.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Self-hosted runners keep their work directory between jobs and share the machine with
      # other work: drop build output left by an interrupted run, and keep every temporary file
      # (including the signing keychain the package command creates) in this runner's own
      # RUNNER_TEMP, which the runner empties per job.
      - name: Prepare the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          rm -rf apps/desktop/.desktop-build node_modules/.cache release-assets
          {
            echo "TMPDIR=$RUNNER_TEMP"
            echo "COREPACK_HOME=$RUNNER_TOOL_CACHE/corepack"
            echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0"
          } >> "$GITHUB_ENV"
          echo "runner=$RUNNER_NAME user=$(id -un) home=${HOME:-unset} temp=$RUNNER_TEMP tool_cache=$RUNNER_TOOL_CACHE"
          sw_vers
          xcode-select -p
          df -h "$GITHUB_WORKSPACE" | tail -1
          sysctl -n hw.memsize | awk '{ printf "memory: %.0f GB\n", $1 / 1073741824 }'

      - name: Enable Developer Mode (symlink support)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      # Hosted runners start empty: pnpm from packageManager plus the Actions pnpm store cache.
      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted'

      - uses: actions/setup-node@v6
        if: runner.environment == 'github-hosted'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Self-hosted: Node lands in the runner's tool cache once, corepack provides the
      # packageManager pnpm, and pnpm's store stays on that runner between jobs (a per-runner
      # cache that needs no upload or restore).
      - uses: actions/setup-node@v6
        if: runner.environment == 'self-hosted'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm through corepack
        if: runner.environment == 'self-hosted'
        run: |
          corepack enable
          pnpm --version
          echo "pnpm store: $(pnpm store path)"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Tags set the release version; other refs build <current>-ci.<run number> and never publish.
      - name: Set the product version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./package.json").version')-ci.$GITHUB_RUN_NUMBER"
          fi
          node apps/desktop/scripts/set-release-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Secrets cannot appear in `if:`; this step turns their presence into signing=full|dry
      # and writes one step-summary line ("Unsigned build: Apple secrets absent" when dry).
      - name: Signing mode
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: node apps/desktop/scripts/macos-ci-signing.mjs gate

      - name: Build
        run: pnpm run build

      # The Session lock loads this flock addon on macOS; packaging packs it as
      # @ahel/node-addon-system-darwin-<arch>. Windows locks through a kernel
      # semaphore and has no addon, so the script is a no-op there.
      - name: Build native addon
        run: pnpm run build:native-system

      # Writes apps/desktop/.env.macos and, under $RUNNER_TEMP/ahel-macos-signing (mode 700), the
      # p12 and AuthKey_<ASC_KEY_ID>.p8 (mode 600). It checks the certificate's team and expiry.
      # The package command owns the keychain (scripts/macos-signing-keychain.mjs): a temporary
      # keychain with a random password, p12 import, set-key-partition-list, prepended to the
      # search list, passed to electron-builder as CSC_KEYCHAIN, deleted after packaging.
      - name: Import certificate
        if: steps.signing.outputs.signing == 'full'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: node apps/desktop/scripts/macos-ci-signing.mjs configure

      # Full builds write artifacts/ and drop the -unsigned suffix; dry and Windows builds write unsigned-artifacts/.
      - name: Select the package mode
        id: mode
        env:
          SIGNING: ${{ steps.signing.outputs.signing }}
        run: |
          root="apps/desktop/.desktop-build/targets/${{ matrix.target }}"
          if [ "$SIGNING" = full ]; then
            printf '%s\n' "script=package:desktop:mac:arm64" "source=$root/artifacts" "suffix=" "signing=signed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "script=${{ matrix.script }}" "source=$root/unsigned-artifacts" "suffix=-unsigned" "signing=unsigned" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder's beforeBuild hook runs prepare-windows-installer.ps1 (MSVC on the hosted image).
      # The packaged smoke inside this step runs one replayed chat turn.
      # Full: hardened runtime (codesign --options runtime --timestamp) with the entitlements in
      # scripts/*-entitlements.plist on every Mach-O, then notarization: the App and the DMG go to
      # Apple concurrently (xcrun notarytool submit, then wait, through scripts/logged-notarytool.mjs
      # with --key AuthKey_<id>.p8 --key-id --issuer) and xcrun stapler staples both
      # (.agents/notes/implemented/process/2026-09-09-parallel-macos-notarization.md).
      - name: Package (${{ steps.signing.outputs.signing || 'unsigned' }})
        run: pnpm run ${{ steps.mode.outputs.script }}

      - name: Check the packaged native addon
        if: runner.os == 'macOS'
        run: |
          addon="${{ steps.mode.outputs.source }}/mac-arm64/Ahel Desktop.app/Contents/Resources/app.asar.unpacked/dsh/node_modules/@ahel/node-addon-system-darwin-arm64/bin/system.node"
          test -f "$addon" && file "$addon"

      # Computer use: the pinned Cua Driver (docs/phase4/COMPUTER-USE.md) ships inside the app.
      # Signed builds re-sign it with the release identity; this shows and checks that signature.
      - name: Check the packaged Cua Driver
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ steps.signing.outputs.signing == 'full' }}
        run: |
          set -euo pipefail
          driver="${{ steps.mode.outputs.source }}/mac-arm64/Ahel Desktop.app/Contents/Resources/cua-driver/cua-driver"
          test -x "$driver"
          file "$driver"
          cat "$(dirname "$driver")/VERSION"
          codesign --display --verbose=2 "$driver" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|CodeDirectory)=' || true
          if [ "$SIGNED" = true ]; then codesign --verify --strict --verbose=2 "$driver"; fi

      # The package command already verified both; this repeats Gatekeeper's view in the job log.
      - name: Check signature, notarization and staple
        if: steps.signing.outputs.signing == 'full'
        run: |
          set -euo pipefail
          source="${{ steps.mode.outputs.source }}"
          app="$source/mac-arm64/Ahel Desktop.app"
          dmg="$source/ahel-desktop-${{ steps.version.outputs.version }}-${{ matrix.target }}.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - --xml "$app" | plutil -p - || true
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          xcrun stapler validate "$dmg"

      # Removes the p12, the .p8 and .env.macos in every mode, also after failure or cancellation.
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          rm -rf "$RUNNER_TEMP/ahel-macos-signing" apps/desktop/.env.macos
          # The package command deletes its keychain; this covers a cancelled or killed run.
          # TMPDIR is this runner's RUNNER_TEMP on self-hosted, so only this job's keychain matches.
          for keychain in "${TMPDIR:-/tmp}"/dsh-macos-signing-*/signing.keychain-db; do
            [ -e "$keychain" ] || continue
            security delete-keychain "$keychain" || true
            rm -rf "$(dirname "$keychain")"
          done

      - name: Collect release assets
        run: |
          version="${{ steps.version.outputs.version }}"
          source="${{ steps.mode.outputs.source }}"
          mkdir -p release-assets
          cp "$source"/*.${{ matrix.installer }} "$source"/*.blockmap "$source"/latest*.yml release-assets/
          if [ "${{ matrix.target }}" = mac-arm64 ]; then cp "$source"/*.zip release-assets/; fi
          # A version-free copy keeps the landing's releases/latest/download/<asset> link stable.
          cp "$source/ahel-desktop-$version-${{ matrix.target }}${{ steps.mode.outputs.suffix }}.${{ matrix.installer }}" \
            "release-assets/ahel-desktop-${{ matrix.target }}.${{ matrix.installer }}"
          # Read and removed by the publish job; it decides the release notes.
          echo "${{ steps.mode.outputs.signing }}" > "release-assets/${{ matrix.target }}.signing"
          ls -la release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    # Runs when a platform failed too: the release carries what built, and the
    # last step still fails the workflow so the broken platform stays visible.
    # Only tags publish: on push, or on a dispatch from the tag with publish=true.
    if: ${{ !cancelled() && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          ls -la release-assets
          if [ ! -f release-assets/ahel-desktop-mac-arm64.dmg ]; then
            echo "::error::the mac-arm64 installer is missing; nothing is published"
            exit 1
          fi
          missing=()
          [ -f release-assets/ahel-desktop-win-x64.exe ] || missing+=("Windows x64")
          mac_signing="$(cat release-assets/mac-arm64.signing 2>/dev/null || echo unsigned)"
          rm -f release-assets/*.signing
          if [ "$mac_signing" = signed ]; then
            notes="Ahel Desktop $version from ${GITHUB_SHA::12}. macOS: signed and notarized; auto-update installs in place. Coming from an unsigned build: install this DMG once by hand."
            windows="Windows: unsigned build; SmartScreen > More info > Run anyway."
          else
            notes="Unsigned beta build of Ahel Desktop $version from ${GITHUB_SHA::12}. macOS: open the app once; when macOS refuses it, go to System Settings > Privacy & Security, press Open Anyway and enter your Mac password. Right-click > Open no longer works on macOS 15."
            windows="Windows: SmartScreen > More info > Run anyway."
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            notes="$notes $windows"
          else
            notes="$notes

          Not in this release: ${missing[*]} (the build failed; see $RUN_URL)."
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ahel Desktop $version" \
            --notes "$notes" \
            "${prerelease[@]}"

      - name: Fail when a platform did not build
        if: needs.package.result != 'success'
        run: |
          echo "::error::package result is ${{ needs.package.result }}; the release lacks a platform"
          exit 1
