# Build Ahel Desktop installers from a v* tag and publish them as a GitHub
# release of this repository, the feed packaged applications read through
# electron-updater.
# macOS is signed and notarized when all five MAC_CERT_*/APPLE_* secrets are set
# and unsigned otherwise; Windows is unsigned. See docs/phase3/RELEASE.md.
name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: package / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # One platform failing must not cancel the other; publish ships what built.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            script: package:desktop:mac:arm64:dev
            installer: dmg
          - os: windows-latest
            target: win-x64
            script: package:desktop:win:x64:unsigned
            installer: exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set the product version from the tag
        run: node apps/desktop/scripts/set-release-version.mjs "$GITHUB_REF_NAME"

      # Secrets cannot appear in `if:`; this step turns their presence into signed=true|false.
      - name: Select macOS signing
        id: signing
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/macos-ci-signing.mjs gate

      - name: Build
        run: pnpm run build

      # The Session lock loads this flock addon on macOS; packaging packs it as
      # @ahel/node-addon-system-darwin-<arch>. Windows locks through a kernel
      # semaphore and has no addon, so the script is a no-op there.
      - name: Build native addon
        run: pnpm run build:native-system

      # Writes $RUNNER_TEMP/ahel-macos-signing/developer-id.p12 and apps/desktop/.env.macos (mode 600).
      # The package command then creates a temporary keychain, imports the p12, sets the key
      # partition list, signs every nested Mach-O with hardened runtime, notarizes the App and DMG
      # through @electron/notarize, staples both, and deletes the keychain.
      - name: Configure macOS signing
        if: steps.signing.outputs.signed == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/macos-ci-signing.mjs configure

      # Signed builds write artifacts/ and drop the -unsigned suffix; unsigned builds write unsigned-artifacts/.
      - name: Select the package mode
        id: mode
        env:
          SIGNED: ${{ steps.signing.outputs.signed == 'true' }}
        run: |
          root="apps/desktop/.desktop-build/targets/${{ matrix.target }}"
          if [ "$SIGNED" = true ]; then
            printf '%s\n' "script=package:desktop:mac:arm64" "source=$root/artifacts" "suffix=" "signing=signed" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "script=${{ matrix.script }}" "source=$root/unsigned-artifacts" "suffix=-unsigned" "signing=unsigned" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder's beforeBuild hook runs prepare-windows-installer.ps1 (MSVC on the hosted image).
      # The packaged smoke inside this step runs one replayed chat turn.
      - name: Package (${{ steps.mode.outputs.signing }})
        run: pnpm run ${{ steps.mode.outputs.script }}

      - name: Check the packaged native addon
        if: runner.os == 'macOS'
        run: |
          addon="${{ steps.mode.outputs.source }}/mac-arm64/Ahel Desktop.app/Contents/Resources/app.asar.unpacked/dsh/node_modules/@ahel/node-addon-system-darwin-arm64/bin/system.node"
          test -f "$addon" && file "$addon"

      # The package command already verified both; this repeats Gatekeeper's view in the job log.
      - name: Verify Gatekeeper acceptance and stapled tickets
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          source="${{ steps.mode.outputs.source }}"
          app="$source/mac-arm64/Ahel Desktop.app"
          dmg="$source/ahel-desktop-${GITHUB_REF_NAME#v}-${{ matrix.target }}.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - --xml "$app" | plutil -p - || true
          spctl -a -vv "$app"
          xcrun stapler validate "$app"
          spctl -a -vv -t install "$dmg"
          xcrun stapler validate "$dmg"

      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          rm -rf "$RUNNER_TEMP/ahel-macos-signing" apps/desktop/.env.macos
          # The package command deletes its keychain; this covers a cancelled or killed run.
          for keychain in "${TMPDIR:-/tmp}"/dsh-macos-signing-*/signing.keychain-db; do
            [ -e "$keychain" ] || continue
            security delete-keychain "$keychain" || true
            rm -rf "$(dirname "$keychain")"
          done

      - name: Collect release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          source="${{ steps.mode.outputs.source }}"
          mkdir -p release-assets
          cp "$source"/*.${{ matrix.installer }} "$source"/*.blockmap "$source"/latest*.yml release-assets/
          if [ "${{ matrix.target }}" = mac-arm64 ]; then cp "$source"/*.zip release-assets/; fi
          # A version-free copy keeps the landing's releases/latest/download/<asset> link stable.
          cp "$source/ahel-desktop-$version-${{ matrix.target }}${{ steps.mode.outputs.suffix }}.${{ matrix.installer }}" \
            "release-assets/ahel-desktop-${{ matrix.target }}.${{ matrix.installer }}"
          # Read and removed by the publish job; it decides the release notes.
          echo "${{ steps.mode.outputs.signing }}" > "release-assets/${{ matrix.target }}.signing"
          ls -la release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    # Runs when a platform failed too: the release carries what built, and the
    # last step still fails the workflow so the broken platform stays visible.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          ls -la release-assets
          if [ ! -f release-assets/ahel-desktop-mac-arm64.dmg ]; then
            echo "::error::the mac-arm64 installer is missing; nothing is published"
            exit 1
          fi
          missing=()
          [ -f release-assets/ahel-desktop-win-x64.exe ] || missing+=("Windows x64")
          mac_signing="$(cat release-assets/mac-arm64.signing 2>/dev/null || echo unsigned)"
          rm -f release-assets/*.signing
          if [ "$mac_signing" = signed ]; then
            notes="Ahel Desktop $version from ${GITHUB_SHA::12}. macOS: signed and notarized; auto-update installs in place. Coming from an unsigned build: install this DMG once by hand."
            windows="Windows: unsigned build; SmartScreen > More info > Run anyway."
          else
            notes="Unsigned build of Ahel Desktop $version from ${GITHUB_SHA::12}. macOS: right-click the app and choose Open, or allow it in System Settings > Privacy & Security."
            windows="Windows: SmartScreen > More info > Run anyway."
          fi
          if [ ${#missing[@]} -eq 0 ]; then
            notes="$notes $windows"
          else
            notes="$notes

          Not in this release: ${missing[*]} (the build failed; see $RUN_URL)."
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ahel Desktop $version" \
            --notes "$notes" \
            "${prerelease[@]}"

      - name: Fail when a platform did not build
        if: needs.package.result != 'success'
        run: |
          echo "::error::package result is ${{ needs.package.result }}; the release lacks a platform"
          exit 1
