# Verify Ahel Desktop on GitHub-hosted runners: typecheck, lint and the unit
# suite for every pull request and every push to master. No self-hosted or
# paid runner labels; public repositories get these minutes free.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # CI never reports product telemetry.
  DSH_TELEMETRY_DISABLED: '1'

# One run per pull request (or per branch for pushes). A new push to a pull
# request cancels its superseded run; master runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # typecheck and lint both need the host declarations; build them once.
      - name: Build host libraries
        run: pnpm run build:lib:host

      - name: Typecheck
        run: pnpm run typecheck:contracts-ready

      - name: Lint
        run: pnpm run lint:contracts-ready

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    # 202 upstream-era tests still fail after the Ahel strip and rebrand
    # (2026-10-05). They are being deleted or fixed; until that lands this
    # job reports but does not block. Typecheck and lint stay required.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Sandbox tests need a working bubblewrap; the script pins and verifies it.
      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Builds the native system addon, then runs vitest.
      - name: Unit tests
        run: pnpm test
