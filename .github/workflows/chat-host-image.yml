# Build the hosted-chat Host image, ghcr.io/ahel-technologies/ahel-chat-host,
# from every v* tag (the same tags that publish Desktop) and on demand.
# Tags: the release version for a v* tag, `latest` for a v* tag or a dispatch
# from master, `sha-<short>` always.
# See docs/phase4/HOSTED-CHAT.md.
name: Chat host image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ahel-technologies/ahel-chat-host

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/chat-host/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
