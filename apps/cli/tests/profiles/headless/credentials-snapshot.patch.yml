# Credential-guidance patch over the shipped headless profile. A hand-declared
# pi-ai route resolves its key from SNAPSHOT_API_KEY and cannot reach its
# endpoint, so the turn ends on credential resolution before any request.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      snapshot:
        apiKeyEnv: SNAPSHOT_API_KEY
        api: anthropic-messages
        baseURL: 'http://127.0.0.1:9'
        models:
          - id: snapshot-model

- id: agent-loop
  config:
    agents:
      - id: main
        provider: snapshot
        model: snapshot-model
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
