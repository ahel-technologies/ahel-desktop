# Ahel Desktop spike: stop Desktop product telemetry and analytics.
# product-telemetry-otel needs an explicit endpoint; this patch keeps it off
# even when the profile is `desktop`.
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
