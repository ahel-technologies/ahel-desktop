- id: terminal-controller
  disabled: true
- id: job-controller
  disabled: true
- id: workspace-changes
  disabled: true
- id: cordis-inspect-providers
  disabled: true

# -- presets: one chat preset with no local tools
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are Ahel, a helpful assistant powered by the {{model}} model.
          suffix: ''
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'

