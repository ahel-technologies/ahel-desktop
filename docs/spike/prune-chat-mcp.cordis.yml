# Ahel Desktop spike: prune overlay for "chat + Ahel MCP only".
# Use: dsh --profile web --patch docs/spike/prune-chat-mcp.cordis.yml
# Disables agent tools (shell, fs, sandbox, subagents, PTC, jobs, schedule,
# web search/fetch, skills, goals, plan, workflows), DeepSeek account/API/
# telemetry plugins, and their client panels. Keeps llm + llm-pi-ai, session
# persistence, settings/credentials, approval pipeline, mcp-client/resources,
# and the Web chat UI.

# -- DeepSeek-specific service plugins
- id: deepseek-llm-api-extensions
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: account-controller
  disabled: true
- id: ui-settings-account
  disabled: true

# -- telemetry
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true

# -- agent tool runtimes (fs-sandbox + sandbox-policy stay: session-controller needs the fs service)
- id: jobs
