# Ahel Desktop Phase 1B dev-only fixture flow: render an MCP Apps card in the
# Web UI without a model key or account.
# - llm-replay (test-support) replays card-fixture.session.v4.jsonl as the
#   "model": it calls mcp__cards__show_card, then answers in text. No key.
# - mcp-cards runs the stdio fixture server with the card tool + ui:// card.
# - The card host row comes from ui-mcp-app.dev.cordis.patch.yml.
# Launch with run-card-fixture.sh, which sets the two AHEL_CARD_* paths.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# The replay script holds only the agent's two model calls; LLM titles would consume one.
- id: session-title-llm
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        file: !!js process.env.AHEL_CARD_FIXTURE_SESSION
        providers:
          - id: deepseek-official
            name: Fixture replay
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]

    - id: mcp-cards
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cards
        transport: stdio
        command: node
        args: !!js "[process.env.AHEL_CARD_FIXTURE_SERVER]"
        failOnStartupError: true
