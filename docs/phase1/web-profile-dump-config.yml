# == @ahel/dsh-base
- id: plugin-manager
  name: '@ahel/dsh-plugin-manager'
  disabled: !!js '!ctx.get(''profileContext'')'
- id: timer
  name: '@ahel/cordis-plugin-timer'
- id: hmr
  name: '@ahel/dsh-hmr'
  disabled: !!js '!ctx.get(''profileContext'')'
  config:
    root: []
- id: llm
  name: '@ahel/dsh-llm'
- id: session
  name: '@ahel/dsh-session'
- id: typert
  name: '@ahel/dsh-typert-registry'
- id: typert-loader
  name: '@ahel/dsh-typert-loader'
- id: typert-gateway
  name: '@ahel/dsh-api-gateway'
- id: session-title
  name: '@ahel/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80
- id: session-title-llm
  name: '@ahel/dsh-session-title-first-prompt-llm'
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000
- id: user-questions
  name: '@ahel/dsh-user-questions'
- id: agent
  name: '@ahel/dsh-agent'
- id: agent-default-model
  name: '@ahel/dsh-agent-default-model'
- id: llm-retry
  name: '@ahel/dsh-llm-retry'
- id: config-editor
  name: '@ahel/dsh-config-editor'
  disabled: !!js '!ctx.get(''profileContext'')'
- id: settings
  name: '@ahel/dsh-settings'
  disabled: !!js '!ctx.get(''profileContext'')'
- id: authorization
  name: '@ahel/dsh-authorization'
- id: credentials
  name: '@ahel/dsh-credentials-local'
- id: llm-pi-ai
  name: '@ahel/dsh-llm-pi-ai'
- id: session-persistence-jsonl
  name: '@ahel/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
- id: attachment-local
  name: '@ahel/dsh-attachment-local'
- id: session-query-sqlite
  name: '@ahel/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- id: session-projection
  name: '@ahel/dsh-session-projection'
- id: storage
  name: '@ahel/dsh-storage'
- id: storage-json
  name: '@ahel/dsh-storage-json'
  config:
    root: !!js dshHomePath('storages')
- id: storage-domain
  name: '@ahel/dsh-storage-domain'
  config:
    backend: json
- id: session-projection-cache
  name: '@ahel/dsh-session-projection-cache'
  config:
    writeEveryEvents: 200
    writeIntervalMs: 5000
- id: sandbox-policy
  name: '@ahel/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
- id: approval
  name: '@ahel/dsh-user-approval'
  config:
    policy: !!js >-
      (process.env.DSH_PERMISSION_MODE ?? 'workspace-write') ===
      'danger-full-access' ? 'never' : 'ask'
- id: commands
  name: '@ahel/dsh-commands'
- id: command-feedback
  name: '@ahel/dsh-command-feedback'
- id: token-meter
  name: '@ahel/dsh-token-meter'
- id: timeout-policy
  name: '@ahel/dsh-tool-call-timeout-policy'
- id: spill-local
  name: '@ahel/dsh-spill-local'
- id: spill-policy
  name: '@ahel/dsh-spill-policy'
  config:
    maxInlineTokens: 12500
- id: session-checkpoint-policy
  name: '@ahel/dsh-session-checkpoint-policy'
- id: image-offload
  name: '@ahel/dsh-compaction-image-offload'
- id: repeat-tool-reminder
  name: '@ahel/dsh-repeat-tool-reminder'
  config:
    thresholds:
      - 3
      - 5
      - 8
    argumentsPreviewChars: 500
- id: mcp-resources
  name: '@ahel/dsh-mcp-resources'
# == @ahel/dsh-base, patched by @ahel/dsh-web-app
- id: tools
  name: '@ahel/dsh-tools'
  config:
    mode: !!js process.env.DSH_TOOLS_MODE
- id: system-prompt
  name: '@ahel/dsh-system-prompt'
  config:
    personaSuffix: ''
    personaPrefix: You are Ahel, a helpful assistant powered by the {{model}} model.
# == @ahel/dsh-base
- id: agent-loop
  name: '@ahel/dsh-agent-loop'
  config:
    agents: []
- id: fs-sandbox
  name: '@ahel/dsh-fs-sandbox'
# == @ahel/dsh-web-app
- id: message-feedback
  name: '@ahel/dsh-message-feedback'
  config:
    maxNoteBytes: 8192
- id: session-log-download
  name: '@ahel/dsh-session-log-export'
- id: workspace
  name: '@ahel/dsh-workspace'
- id: session-reference
  name: '@ahel/dsh-session-reference'
- id: file-reference-local
  name: '@ahel/dsh-file-reference-local'
- id: session-stats
  name: '@ahel/dsh-session-stats'
- id: session-turn-outline
  name: '@ahel/dsh-session-turn-outline'
- id: directory-picker
  name: '@ahel/dsh-host-directory-picker-auto'
- id: plugin-inventory
  name: '@ahel/dsh-host-plugin-inventory'
- id: session-controller
  name: '@ahel/dsh-api-session-controller'
- id: settings-controller
  name: '@ahel/dsh-api-settings-controller'
- id: workspace-controller
  name: '@ahel/dsh-api-workspace-controller'
- id: cordis-host-runner
  name: '@ahel/dsh-cordis-host-runner'
- id: web-startup
  name: '@ahel/dsh-web-app/startup'
- id: webserver
  name: '@ahel/dsh-host-webserver'
  inject:
    - webStartup
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- id: web-runtime
  name: '@ahel/dsh-web-app'
  inject:
    - webStartup
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
- id: client-hmr
  name: '@ahel/dsh-client-hmr'
- id: modules
  name: '@ahel/dsh-client-modules'
- id: connection
  name: '@ahel/dsh-client-connection'
  inject:
    - webRuntime
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
- id: file-upload
  name: '@ahel/dsh-client-file-upload'
- id: api-remotes
  name: '@ahel/dsh-api-remotes'
- id: cordis-client-runner
  name: '@ahel/dsh-cordis-client-runner'
- id: ui-theme
  name: '@ahel/dsh-client-ui-theme'
- id: locale
  name: '@ahel/dsh-client-locale'
- id: shortcuts
  name: '@ahel/dsh-client-shortcuts'
- id: ui-shortcuts
  name: '@ahel/dsh-client-ui-shortcuts'
- id: ui-layout
  name: '@ahel/dsh-client-ui-layout'
- id: ui-renderer
  name: '@ahel/dsh-client-ui-renderer'
- id: ui-session
  name: '@ahel/dsh-client-ui-session'
- id: resources
  name: '@ahel/dsh-client-resources'
- id: ui-sidebar
  name: '@ahel/dsh-client-ui-sidebar'
- id: ui-sidebar-right
  name: '@ahel/dsh-client-ui-sidebar-right'
- id: ui-settings
  name: '@ahel/dsh-client-ui-settings'
- id: ui-settings-general
  name: '@ahel/dsh-client-ui-settings-general'
- id: ui-settings-models
  name: '@ahel/dsh-client-ui-settings-models'
- id: ui-plugin-manager
  name: '@ahel/dsh-client-ui-plugin-manager'
- id: ui-settings-plugin-inventory
  name: '@ahel/dsh-client-ui-settings-plugin-inventory'
- id: ui-conversation
  name: '@ahel/dsh-client-ui-conversation'
- id: ui-approval
  name: '@ahel/dsh-client-ui-approval'
- id: ui-chat
  name: '@ahel/dsh-client-ui-chat'
- id: ui-brand-ahel
  name: '@ahel/dsh-client-ui-brand-ahel'
- id: ui-attachment
  name: '@ahel/dsh-client-ui-attachment'
- id: ui-tool
  name: '@ahel/dsh-client-ui-tool'
- id: ui-workspace
  name: '@ahel/dsh-client-ui-workspace'
- id: ui-input-trigger
  name: '@ahel/dsh-client-ui-input-trigger'
- id: ui-commands
  name: '@ahel/dsh-client-ui-commands'
- id: ui-reference
  name: '@ahel/dsh-client-ui-reference'
- id: ui-message-feedback
  name: '@ahel/dsh-client-ui-message-feedback'
- id: ui-model-selection
  name: '@ahel/dsh-client-ui-model-selection'
- id: ui-agent-preset
  name: '@ahel/dsh-client-ui-agent-preset'
- id: ui-settings-plugins
  name: '@ahel/dsh-client-ui-settings-plugins'
- id: ui-settings-agent-loop
  name: '@ahel/dsh-client-ui-settings-agent-loop'
- id: ui-user-questions
  name: '@ahel/dsh-client-ui-user-questions'
- id: ui-trajectory
  name: '@ahel/dsh-client-ui-trajectory'
- id: agent-preset-registry
  name: '@ahel/dsh-agent-preset-registry'
  config:
    default: standard
- id: preset-standard
  name: '@ahel/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@ahel/dsh-persona'
        config:
          suffix: ''
          prefix: You are Ahel, a helpful assistant powered by the {{model}} model.
      - id: time-context
        name: '@ahel/dsh-time-context'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@ahel/dsh-compaction-basic'
          - id: command-compact
            name: '@ahel/dsh-command-compact'
          - id: tool-result-pruner
            name: '@ahel/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: tool-ask-user
        name: '@ahel/dsh-tool-ask-user'
