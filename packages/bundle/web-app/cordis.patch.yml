# The dsh-web-app bundle patch: the browser surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The web-startup plugin injects `cmdlineArgs` and provides `webStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The web runtime then
# provides bind-dependent `webRuntime` values to the trust fence.
# `dsh --profile web --help` provides no `webStartup`, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    personaSuffix: ''
    personaPrefix: >-
      You are Ahel, a helpful assistant powered by the {{model}} model.

# Full-text session search is opt-in (the base row's `openAt: never`). This
# restatement keeps the Web values on one ephemeral in-memory index; a
# deployment enabling content search overrides `openAt` to `first-search` in a
# later patch layer, which defers the node:sqlite import and in-memory handle
# to the first search so Node 22 startup stays quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # TEMPORARY workaround: DSH_TOOLS_MODE (native|ptc|both) opts a whole dsh
    # process into PTC mode while per-session tool-presentation selection is being
    # designed; unset keeps the schema default (native). Remove the env seam
    # once the web UI owns the choice per session.
    mode: !!js process.env.DSH_TOOLS_MODE

# Ahel product builds install no plugins: the plugin page offers no Add
# plugin control and the Host refuses installBundle.
- id: plugin-manager
  disabled: !!js "!ctx.get('profileContext')"
  config:
    installEnabled: false

# ── web-only host rows, the transport layer, and the browser roster ─────────

# `dsh.client` rows are the browser roster the modules node half scans into
# window.__DSH_BOOT__; the modules row is simultaneously a host row.
- insert:
    - id: message-feedback
      name: '@ahel/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # Browser Session export: `/export` command plus the shared download dialog.
    - id: session-log-download
      name: '@ahel/dsh-session-log-export'

    - id: workspace
      name: '@ahel/dsh-workspace'

    - id: session-reference
      name: '@ahel/dsh-session-reference'

    - id: file-reference-local
      name: '@ahel/dsh-file-reference-local'

    # Whole-log turn/step counts for the chat stats strip (the sessionStats
    # projection key); the projection registry itself is a base-layer row.
    - id: session-stats
      name: '@ahel/dsh-session-stats'

    # Whole-log turn outline for the chat turn rail (the turnOutline
    # projection key): every turn stays navigable before its events page in.
    - id: session-turn-outline
      name: '@ahel/dsh-session-turn-outline'

    # Resolve bind host, SSH launch, and display once at boot, then mount the
    # matching dual-face directory picker. Mount -native or -browse directly in
    # an overlay to pin the interaction.
    - id: directory-picker
      name: '@ahel/dsh-host-directory-picker-auto'

    # Read-only projection of current Loader entries for trusted client RPCs.
    - id: plugin-inventory
      name: '@ahel/dsh-host-plugin-inventory'

    # Session commands, cold reads, and live control over Typert Remote.
    - id: session-controller
      name: '@ahel/dsh-api-session-controller'

    - id: settings-controller
      name: '@ahel/dsh-api-settings-controller'

    # Workspace commands and reconnect-safe projection over Typert Remote.
    # Ahel Desktop keeps its first-use Workspace in the harness home, so first
    # launch never touches the Documents folder.
    - id: workspace-controller
      name: '@ahel/dsh-api-workspace-controller'
      config:
        workspacesDirectory: !!js "ctx.get('profileContext')?.name === 'desktop' ? dshHomePath('workspaces') : undefined"

    - id: cordis-host-runner
      name: '@ahel/dsh-cordis-host-runner'

    # Ordinary provider for the parsed Web flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: web-startup
      name: '@ahel/dsh-web-app/startup'

    # ── layer 2: transport/service ──────────────────────────────────────────────

    # Plain route-registration carrier; host and port come from the app's
    # webStartup provider, with these deployment fallbacks. The dist is served
    # by the web-runtime row below through the fallback seat. Routing and
    # browser-facing asset paths do not depend on the advertised URL, which the
    # web-runtime row owns.
    - id: webserver
      name: '@ahel/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # Web glue owned by this bundle: resolves the built frontend dist (an
    # assembly fact of dsh-web-app, never user config), mounts the
    # frontend-static fallback owner, registers the web-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical URL after the full Loader tree settles and the required-
    # entry audit passes. Invocation-only values come from the webStartup
    # provider; the advertised application URL is this row's `publicUrl` (the
    # loopback URL when unset). After the server binds, this row samples LAN
    # trust once and provides `webRuntime`. A complete agent-preset persona
    # suppresses the prompt section for that agent while retaining the
    # host-owned shell variable.
    - id: web-runtime
      name: '@ahel/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        # The URL line carries the launch token; Desktop reads its URL over IPC
        # and never prints it.
        printUrl: !!js "ctx.get('profileContext')?.name !== 'desktop'"
        publicUrl: !!js ctx.webStartup.publicUrl
        surfaceContext: true
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # The client-plugin reload chain, always mounted: it is idle until a
    # rebuild watcher (pnpm run dev:web) actually rewrites client bundles. It
    # is a row rather than a child of web-runtime because its node half is a
    # client-side package, which a host-side bundle cannot import.
    - id: client-hmr
      name: '@ahel/dsh-client-hmr'

    # ── browser plugin roster (dsh.client rows; node halves are layer-2 hosts) ──

    # Dual-face: the node half scans this tree, composes window.__DSH_BOOT__,
    # and serves /plugins/<id>/client.js; the browser half is the module table
    # the shell kernel constructs before cordis exists (adopted as a plugin
    # entry by the kernel, never fetched).
    - id: modules
      name: '@ahel/dsh-client-modules'

    # Owns both ends of the web transport: node half binds the gateway to the
    # webserver under /api; browser half is the fetch/SSE client. Every API
    # request and upgrade passes the loopback plus trustedHosts policy; an
    # advertised public URL contributes nothing to it.
    - id: connection
      name: '@ahel/dsh-client-connection'
      inject: [webRuntime]
      config:
        # LAN literals derived from the active bind plus --trusted-host extras.
        # A deployment adding authorities keeps this expression and concatenates
        # its literals, for example: ['app.internal', ...ctx.webRuntime.trustedHosts].
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    # Raw Blob and ReadableStream uploads run independently of Connection's
    # RPC and generation service.
    - id: file-upload
      name: '@ahel/dsh-client-file-upload'

    - id: api-remotes
      name: '@ahel/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@ahel/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@ahel/dsh-client-ui-theme'

    - id: locale
      name: '@ahel/dsh-client-locale'

    - id: shortcuts
      name: '@ahel/dsh-client-shortcuts'

    - id: ui-shortcuts
      name: '@ahel/dsh-client-ui-shortcuts'

    - id: ui-layout
      name: '@ahel/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@ahel/dsh-client-ui-renderer'

    - id: ui-session
      name: '@ahel/dsh-client-ui-session'

    # Unified resource model: protocol providers behind the useResource hook.
    - id: resources
      name: '@ahel/dsh-client-resources'

    - id: ui-sidebar
      name: '@ahel/dsh-client-ui-sidebar'

    # The right Sidebar: one docking surface per session over ui-dockkit. Its
    # panel and header toggle show only with Developer tools; ui-chat and
    # ui-reference require its sidebarRight service, so it stays mounted.
    - id: ui-sidebar-right
      name: '@ahel/dsh-client-ui-sidebar-right'

    - id: ui-settings
      name: '@ahel/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@ahel/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@ahel/dsh-client-ui-settings-models'

    # Plugin management: the sidebar Plugins page (Developer tools only)
    # enables, disables, and removes the profile's bundles through the
    # `pluginManager` Remote.
    # Without a profile-backed Host it reports itself unavailable.
    - id: ui-plugin-manager
      name: '@ahel/dsh-client-ui-plugin-manager'
      config:
        registryProbeEnabled: false

    # Read-only Plugin list tab in the Settings Plugins section; the built-in
    # bundles the sidebar page leaves out are inspected here.
    - id: ui-settings-plugin-inventory
      name: '@ahel/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@ahel/dsh-client-ui-conversation'

    - id: ui-approval
      name: '@ahel/dsh-client-ui-approval'

    - id: ui-chat
      name: '@ahel/dsh-client-ui-chat'

    # Ahel occupants for the generic sidebar and conversation brand slots.
    - id: ui-brand-ahel
      name: '@ahel/dsh-client-ui-brand-ahel'

    - id: ui-attachment
      name: '@ahel/dsh-client-ui-attachment'

    # Tool call tree, generic fallback, and keyed business Tool views.
    - id: ui-tool
      name: '@ahel/dsh-client-ui-tool'

    # MCP Apps cards: the Host `mcpApps` Remote and the browser card that fills
    # ui-tool's `tool.call.app` slot (package from phase1/card-renderer).
    - id: ui-mcp-app
      name: '@ahel/dsh-client-ui-mcp-app'

    # Ahel account: one ahel.ai sign-in (credential AHEL_ACCOUNT) shared by
    # the Ahel MCP server and Ahel-metered models. mcp-ahel connects only while
    # signed in and drops its tools on sign-out. URL is mcp.ahel.ai/mcp because
    # ahel.ai/mcp advertises resource https://mcp.ahel.ai.
    - id: ahel-account
      name: '@ahel/dsh-ahel-account'

    - id: mcp-ahel
      name: '@ahel/dsh-mcp-client'
      config:
        serverName: ahel
        transport: streamable-http
        url: https://mcp.ahel.ai/mcp
        auth:
          credentialRef: AHEL_ACCOUNT
          workspaceParam: workspace
        reconnect:
          enabled: true
          initialDelayMs: 2000
          maxDelayMs: 30000
          maxAttempts: 1000

    # Ahel-metered models (route `ahel`), next to the BYO-key llm-pi-ai routes.
    - id: llm-ahel
      name: '@ahel/dsh-llm-ahel'

    # Web search on by default: web_search and web_fetch run on ahel.ai's
    # read-only Web Search app with the Ahel account's bearer, metered by
    # ahel.ai. web-search-ahel mounts dsh-tool-web as a child only while an
    # Ahel account is signed in, so signed out both tools are absent.
    - id: web
      name: '@ahel/dsh-web'
      config:
        searchProvider: ahel
        fetchProvider: ahel

    - id: web-search-ahel
      name: '@ahel/dsh-web-search-ahel'
      config:
        requestTimeoutMs: 45000
        tools:
          searchMaxQueries: 3
          searchTimeoutMs: 60000
          fetchTimeoutMs: 60000

    # Dictation: the mic between the model picker and Send records 16 kHz
    # mono WAV; ahel.ai transcribes it through the signed-in account (metered
    # on the workspace balance) and the text lands in the draft, never sent.
    # Only the cloud provider is mounted: the local SenseVoice engine (about
    # 239 MB on first use) stays out; the optional voice-input-bundle adds it.
    - id: speech-to-text
      name: '@ahel/dsh-experimental-speech-to-text'
      config:
        defaultProvider: ahel-cloud

    - id: speech-to-text-ahel
      name: '@ahel/dsh-experimental-speech-to-text-ahel'

    - id: api-speech-to-text
      name: '@ahel/dsh-experimental-api-speech-to-text'
      config:
        maxDurationSeconds: 60

    - id: ui-voice-input
      name: '@ahel/dsh-experimental-client-ui-voice-input'

    # Claude Code, Codex and Gemini CLIs the person installed and signed into
    # themselves; detection and enable state only, the person's own vendor plan pays.
    # Local child processes for the llm-local-cli probes and CLI turns; the
    # web and desktop profiles do not list dsh-agent-tools, which also provides it.
    - id: subprocess
      name: '@ahel/dsh-subprocess-local'

    - id: llm-local-cli
      name: '@ahel/dsh-llm-local-cli'

    # Sidebar account menu and the Ahel row in Settings > Models.
    - id: ui-ahel-account
      name: '@ahel/dsh-client-ui-ahel-account'

    # Team issues over the account's ahelIssues namespace: board, detail, New Issue, Run with Ahel.
    - id: ui-issues
      name: '@ahel/dsh-client-ui-issues'

    # Detected-on-this-computer rows in Settings > Models, after the Ahel row.
    - id: ui-local-cli
      name: '@ahel/dsh-client-ui-local-cli'

    # Window capture: composer button, global-shortcut row in Settings >
    # General, and the captured window's image and text as draft attachments.
    # Registers nothing outside Ahel Desktop, whose preload supplies the bridge.
    - id: ui-window-capture
      name: '@ahel/dsh-client-ui-window-capture'

    - id: ui-workspace
      name: '@ahel/dsh-client-ui-workspace'

    # Cmd+K / Ctrl+K palette over chats, panels, apps, models and settings, plus the chat and panel jump keys.
    - id: ui-command-palette
      name: '@ahel/dsh-client-ui-command-palette'

    # Input triggers: the '/' | '@' pipeline (ui-input-trigger), the command surface over
    # it (ui-commands), and the reference source (ui-reference).
    - id: ui-input-trigger
      name: '@ahel/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@ahel/dsh-client-ui-commands'

    - id: ui-reference
      name: '@ahel/dsh-client-ui-reference'

    # The feedback surface: Like/Dislike in the assistant-message action
    # strip, the feedback dialog behind Dislike and /feedback with its
    # acknowledgement toast, over the messageFeedback and sessionFeedback Remotes.
    - id: ui-message-feedback
      name: '@ahel/dsh-client-ui-message-feedback'

    # Model selection: the /model popupSelect + composer seat over session.models.
    - id: ui-model-selection
      name: '@ahel/dsh-client-ui-model-selection'

    # The agent-preset row in General settings: the default preset for
    # sessions created later. Absent a roster it renders nothing.
    - id: ui-agent-preset
      name: '@ahel/dsh-client-ui-agent-preset'

    # The Built-in plugins settings section: the navigation entry and the tab
    # row the inventory tab registers into. The official configuration pages
    # are the companion rows below.
    - id: ui-settings-plugins
      name: '@ahel/dsh-client-ui-settings-plugins'

    - id: ui-settings-agent-loop
      name: '@ahel/dsh-client-ui-settings-agent-loop'

    # Settings > General > Web search: Ahel Web Search status and its on switch.
    - id: ui-settings-web-search
      name: '@ahel/dsh-client-ui-settings-web-search'

    - id: ui-user-questions
      name: '@ahel/dsh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@ahel/dsh-client-ui-trajectory'

    # System notifications when a reply is ready, a chat waits for the person,
    # or a teammate hands over a chat, while the window is not focused; the
    # switch is in Settings > General.
    - id: ui-notifications
      name: '@ahel/dsh-client-ui-notifications'

# The preset selection registry. The shipped preset declarations follow as
# separate patch files under `presets/`, listed after this file in
# `package.json` `dsh.bundle.patch`.
- insert:
    - id: agent-preset-registry
      name: '@ahel/dsh-agent-preset-registry'
      config:
        default: standard
