# Agent preset standard: one `@ahel/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
#
# Ahel Desktop is chat plus MCP: the preset carries no shell, filesystem,
# skill, subagent, workflow, schedule or web tools. MCP tools register through
# the host `mcp-client` rows, not through this preset.
- insert:
    - id: preset-standard
      name: '@ahel/dsh-agent-preset'
      config:
        id: standard
        order: 1
        plugins:
          - id: persona
            name: '@ahel/dsh-persona'
            config:
              suffix: >-
                Ahel is an AI workspace for your company. Never state or estimate a total of what the person paid or what a task cost: you can't see model usage, and the app shows the real costs.
              prefix: You are Ahel, a helpful assistant powered by the {{model}} model.
          - id: time-context
            name: '@ahel/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@ahel/dsh-compaction-basic'
              - id: command-compact
                name: '@ahel/dsh-command-compact'
              - id: tool-result-pruner
                name: '@ahel/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@ahel/dsh-tool-ask-user'
