# The dsh-agent-tools bundle patch: the local agent tool plane (shell, files,
# sandboxes, skills, subagents, PTC, workflows, jobs, goals, plan mode, web
# tools) and the opt-in telemetry rows, inserted over `@ahel/dsh-base`.
#
# Ahel Desktop ships chat plus MCP only, so the web and desktop profiles never
# list this bundle and the desktop runtime does not carry its packages. The
# headless, sdk and acp profiles list it between dsh-base and their mode
# bundle, so their mode patches still address these rows by id.

- insert:
    - id: tool-plugin-manager
      name: '@ahel/dsh-plugin-manager/tools'
      disabled: true

    - id: jobs
      name: '@ahel/dsh-jobs-local'

    # Telemetry export is off: both rows stay declared for profiles that opt
    # in through a later patch layer, and no collector endpoint ships. An
    # opt-in layer supplies `disabled: false` plus DSH_TELEMETRY_OTLP_URL.
    - id: otel
      name: '@ahel/dsh-otel'
      disabled: true

    - id: session-telemetry-otel
      name: '@ahel/dsh-session-telemetry-otel'
      disabled: true
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        maxRequestBytes: 4000000
        exporter:
          url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? ''
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@ahel/dsh-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@ahel/dsh-sandbox-local'

    - id: bash-sandbox
      name: '@ahel/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@ahel/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: permission
      name: '@ahel/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@ahel/dsh-shell-env'

    - id: tool-bash
      name: '@ahel/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@ahel/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@ahel/dsh-tool-jobs'

    - id: fs-observation-policy
      name: '@ahel/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@ahel/dsh-tool-fs'

    - id: tool-fs-search
      name: '@ahel/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@ahel/dsh-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@ahel/dsh-skill'

    - id: skill-filesystem
      name: '@ahel/dsh-skill-filesystem'

    - id: skill-badge
      name: '@ahel/dsh-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@ahel/dsh-tool-skill'

    - id: goal
      name: '@ahel/dsh-goal'

    - id: goal-round-driver
      name: '@ahel/dsh-goal-round-driver'

    - id: command-goal
      name: '@ahel/dsh-command-goal'

    - id: plan-mode
      name: '@ahel/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: compaction-basic
      name: '@ahel/dsh-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@ahel/dsh-command-compact'

    - id: subagent
      name: '@ahel/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@ahel/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@ahel/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@ahel/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@ahel/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@ahel/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This base row
    # stays one-shot; preset layers may select continuable mode without adding a
    # child-only system-prompt section or tool schema ahead of that history.
    # See .agents/notes/implemented/feature/2026-08-18-model-selected-subagent-routes.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@ahel/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: ptc-runtime
      name: '@ahel/dsh-ptc-runtime-node'

    - id: workflow-ptc
      name: '@ahel/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@ahel/dsh-tool-workflow'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@ahel/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@ahel/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@ahel/dsh-tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script. Off by
    # default: the tool description restricts `ralph` to runs the human
    # explicitly asked for, and completion is a worker self-report, not an
    # independent evaluation. An overlay row restores it for a base-backed
    # profile (`$DSH_HOME/cordis.patch.yml`, or a `--patch <file>`):
    #   - id: tool-ralph
    #     disabled: false
    - id: tool-ralph
      name: '@ahel/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

    # Model-facing web_fetch is on; web_search has no shipped provider, so a
    # profile that wants search mounts one (for example
    # `@ahel/dsh-web-search-exa`) and names it in `searchProvider`.
    # Anonymous fetch accepts only public HTTP(S) destinations, resolves and
    # validates every destination, and pins every actual connection.
    - id: web
      name: '@ahel/dsh-web'
      config:
        fetchProvider: http

    - id: web-fetch-http
      name: '@ahel/dsh-web-fetch-http'

    - id: tool-web
      name: '@ahel/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000
